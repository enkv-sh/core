name: Build signed draft candidate
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-candidate
  cancel-in-progress: false
env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  CLI_PUBLIC_KEY_PEM: ${{ vars.CLI_PUBLIC_KEY_PEM }}
  PLUGIN_PUBLIC_KEY_PEM: ${{ vars.PLUGIN_PUBLIC_KEY_PEM }}
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'enkv-sh/core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      tools_commit: ${{ steps.tools.outputs.commit }}
    steps:
      - name: Check owner release inputs
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEVELOPMENT_CLI_KEY: ${{ vars.DEVELOPMENT_CLI_PUBLIC_KEY_SHA256 }}
          DEVELOPMENT_PLUGIN_KEY: ${{ vars.DEVELOPMENT_PLUGIN_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          import hashlib, os, re
          if os.environ['REF_PROTECTED'] != 'true':
              raise SystemExit('release main must have branch protection or an active ruleset')
          if not re.fullmatch('[0-9a-f]{40}', os.environ['SOURCE_COMMIT']):
              raise SystemExit('GitHub dispatch source commit is required')
          import base64
          development = {os.environ['DEVELOPMENT_CLI_KEY'], os.environ['DEVELOPMENT_PLUGIN_KEY']}
          if not all(re.fullmatch('[0-9a-f]{64}', value) for value in development):
              raise SystemExit('known development SPKI DER fingerprints are required')
          roots = {}
          for name in ['CLI', 'PLUGIN']:
              lines = os.environ[name + '_PUBLIC_KEY_PEM'].strip().splitlines()
              if len(lines) < 3 or lines[0] != '-----BEGIN PUBLIC KEY-----' or lines[-1] != '-----END PUBLIC KEY-----':
                  raise SystemExit('SPKI public verification root is required')
              der = base64.b64decode(''.join(lines[1:-1]), validate=True)
              if len(der) != 44 or der[:12] != bytes.fromhex('302a300506032b6570032100'):
                  raise SystemExit('Ed25519 SPKI verification root is required')
              roots[name] = der
              if hashlib.sha256(der).hexdigest() in development:
                  raise SystemExit('development key cannot sign production releases')
          if roots['CLI'] == roots['PLUGIN']:
              raise SystemExit('CLI and plugin roots must differ')
          PY_CHECK
      - name: Select protected extensions main once
        id: select-tools
        if: github.run_attempt == '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_TOOLS'
          import json, os, re, urllib.request
          from pathlib import Path
          request = urllib.request.Request(
              'https://api.github.com/repos/enkv-sh/extensions/branches/main',
              headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'enkv-release'})
          with urllib.request.urlopen(request, timeout=30) as response:
              branch = json.load(response)
          commit = branch.get('commit', {}).get('sha', '')
          if branch.get('name') != 'main' or branch.get('protected') is not True:
              raise SystemExit('extensions main must have branch protection or an active ruleset')
          if not isinstance(commit, str) or not re.fullmatch('[0-9a-f]{40}', commit):
              raise SystemExit('extensions main did not resolve to one full commit')
          directory = Path(os.environ['RUNNER_TEMP']) / 'release-tools'
          directory.mkdir()
          (directory / 'commit').write_text(commit + '\n')
          PY_TOOLS
      - name: Retain selected extensions commit for this run
        if: github.run_attempt == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-tools-commit
          path: ${{ runner.temp }}/release-tools/commit
          if-no-files-found: error
          retention-days: 90
      - name: Restore the original extensions commit on reruns
        id: restore-tools
        if: github.run_attempt != '1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-tools-commit
          path: ${{ runner.temp }}/release-tools
      - name: Check selected extensions commit
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_TOOLS'
          import os, re
          from pathlib import Path
          value = (Path(os.environ['RUNNER_TEMP']) / 'release-tools/commit').read_text()
          if not re.fullmatch('[0-9a-f]{40}\n', value):
              raise SystemExit('the original run tools commit is missing or invalid; start a new workflow run')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + value)
          PY_TOOLS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: enkv-sh/extensions
          ref: ${{ steps.tools.outputs.commit }}
          path: tools-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build reviewed release tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir tools-source/bin
          for tool in enkv-release enkv-plugin-build enkv-artifact-sign; do
            (cd tools-source/sdk/artifact && go build -mod=readonly -trimpath -buildvcs=false -o "../../bin/$tool" "./cmd/$tool")
          done
      - id: matrix
        shell: bash
        run: echo "matrix=$(tools-source/bin/enkv-release matrix -inventory tools-source/distribution/release.json -kind cli)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    steps:
      - name: Prepare native Linux C toolchain
        if: runner.os == 'Linux'
        shell: sh
        run: |
          set -eu
          dnf install -y gcc gcc-c++ glibc-devel git tar gzip python3 findutils
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.34'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: enkv-sh/extensions
          ref: ${{ needs.prepare.outputs.tools_commit }}
          path: tools-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build reviewed release tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir tools-source/bin
          for tool in enkv-release enkv-plugin-build enkv-artifact-sign; do
            (cd tools-source/sdk/artifact && go build -mod=readonly -trimpath -buildvcs=false -o "../../bin/$tool" "./cmd/$tool")
          done
          cp source/compositions/full/go.mod "$RUNNER_TEMP/bootstrap.go.mod"
          (cd source/compositions/full && go mod download all)
          cmp source/compositions/full/go.mod "$RUNNER_TEMP/bootstrap.go.mod"
          (cd source/compositions/full && go build -mod=readonly -trimpath -buildvcs=false -o "$GITHUB_WORKSPACE/tools-source/bin/enkv-cli-package" ./cmd/enkv-cli-package)
      - name: Build native versioned payload
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          TOOLS_COMMIT: ${{ needs.prepare.outputs.tools_commit }}
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_PLATFORM"
          test "$(go env GOVERSION)" = go1.27.3
          cc --version
          python3 tools-source/distribution/release.py build-cli --source source --tools tools-source --work "$RUNNER_TEMP/build"
          tar -xzf "$RUNNER_TEMP/build/cli/"*.tar.gz -C "$RUNNER_TEMP/build" enkv
          tools-source/bin/enkv-release floor -binary "$RUNNER_TEMP/build/enkv" > "$RUNNER_TEMP/build/cli/evidence/native-environment.txt"
          uname -a >> "$RUNNER_TEMP/build/cli/evidence/native-environment.txt"
          go version -m "$RUNNER_TEMP/build/enkv" > "$RUNNER_TEMP/build/cli/evidence/buildinfo.txt"
          printf 'Extensions tools commit: %s\n' "$TOOLS_COMMIT" >> "$RUNNER_TEMP/build/cli/evidence/native-environment.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.tuple }}
          path: ${{ runner.temp }}/build/cli/*
          if-no-files-found: error
          retention-days: 14
  sign:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: enkv-sh/extensions
          ref: ${{ needs.prepare.outputs.tools_commit }}
          path: tools-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build reviewed release tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir tools-source/bin
          for tool in enkv-release enkv-plugin-build enkv-artifact-sign; do
            (cd tools-source/sdk/artifact && go build -mod=readonly -trimpath -buildvcs=false -o "../../bin/$tool" "./cmd/$tool")
          done
          cp source/compositions/full/go.mod "$RUNNER_TEMP/bootstrap.go.mod"
          (cd source/compositions/full && go mod download all)
          cmp source/compositions/full/go.mod "$RUNNER_TEMP/bootstrap.go.mod"
          (cd source/compositions/full && go build -mod=readonly -trimpath -buildvcs=false -o "$GITHUB_WORKSPACE/tools-source/bin/enkv-cli-package" ./cmd/enkv-cli-package)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*'
          path: ${{ runner.temp }}/finish/incoming
      - name: Sign and independently check the complete candidate
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.CLI_SIGNING_KEY_PEM }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          export CLI_PRIVATE_KEY_FILE="$RUNNER_TEMP/private.pem"
          trap 'rm -f "$RUNNER_TEMP/private.pem"' EXIT
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/private.pem"
          python3 tools-source/distribution/release.py finish-cli --source source --tools tools-source --work "$RUNNER_TEMP/finish" --commit "$SOURCE_COMMIT"
          tar -cf "$RUNNER_TEMP/candidate.tar" -C "$RUNNER_TEMP/finish" candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-candidate
          path: ${{ runner.temp }}/candidate.tar
          if-no-files-found: error
          retention-days: 14
  stage:
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    environment: release-draft
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: enkv-sh/extensions
          ref: ${{ needs.prepare.outputs.tools_commit }}
          path: tools-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build reviewed release tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir tools-source/bin
          for tool in enkv-release enkv-plugin-build enkv-artifact-sign; do
            (cd tools-source/sdk/artifact && go build -mod=readonly -trimpath -buildvcs=false -o "../../bin/$tool" "./cmd/$tool")
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-candidate
          path: ${{ runner.temp }}/candidate-input
      - name: Verify candidate and stage exact draft bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/stage"
          tar -xf "$RUNNER_TEMP/candidate-input/candidate.tar" -C "$RUNNER_TEMP/stage"
          printf '%s' "$CLI_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/cli-public.pem"
          printf '%s' "$PLUGIN_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/plugin-public.pem"
          tools-source/bin/enkv-release assets -inventory tools-source/distribution/release.json -directory "$RUNNER_TEMP/stage/candidate" -output "$RUNNER_TEMP/stage/assets" -cli-public-key "$RUNNER_TEMP/cli-public.pem" -plugin-public-key "$RUNNER_TEMP/plugin-public.pem"
          TAG=$(python3 -c 'import json; print("v" + json.load(open("tools-source/distribution/release.json"))["cli_version"])')
          python3 tools-source/distribution/stage-release.py --repository enkv-sh/core --tag "$TAG" --source "$SOURCE_COMMIT" --assets "$RUNNER_TEMP/stage/assets"
